name: Update map

on:
  schedule:                       # GitHub cron is UTC: roughly 08:00, 16:00 and 23:00 in Sofia
    - cron: "0 5 * * *"
    - cron: "0 13 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      from_date:
        description: "Backfill from this date, YYYY-MM-DD (leave empty for automatic)"
        required: false

permissions:
  contents: read                  # default for every job; jobs below ask for more only where needed

concurrency:
  group: update-map               # never run two updates at once
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write             # needed to commit the new data files
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (pinned versions)
        run: pip install -r requirements.txt

      - name: Run the offline tests
        run: python -m unittest discover -s tests

      - name: Pull new posts (public web preview - no login, no secrets)
        env:
          FROM_DATE: ${{ inputs.from_date }}
        run: python src/pull.py

      - name: Commit the data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update data $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push

      - name: Build the page
        run: python src/build.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
